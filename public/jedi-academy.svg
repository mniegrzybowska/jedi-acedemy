<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
    </style>
  </defs>

  <!-- Stars background -->
  <rect width="800" height="300" fill="#000000"/>
  <circle cx="50" cy="30" r="1" fill="#fff" opacity="0.8"/>
  <circle cx="150" cy="80" r="1.2" fill="#fff" opacity="0.6"/>
  <circle cx="250" cy="20" r="0.8" fill="#fff" opacity="0.9"/>
  <circle cx="350" cy="60" r="1" fill="#fff" opacity="0.7"/>
  <circle cx="450" cy="25" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="550" cy="70" r="1" fill="#fff" opacity="0.8"/>
  <circle cx="650" cy="40" r="0.8" fill="#fff" opacity="0.6"/>
  <circle cx="750" cy="55" r="1.2" fill="#fff" opacity="0.9"/>
  <circle cx="100" cy="250" r="1" fill="#fff" opacity="0.7"/>
  <circle cx="200" cy="270" r="1.3" fill="#fff" opacity="0.5"/>
  <circle cx="300" cy="240" r="0.9" fill="#fff" opacity="0.8"/>
  <circle cx="500" cy="260" r="1.1" fill="#fff" opacity="0.6"/>
  <circle cx="600" cy="280" r="0.7" fill="#fff" opacity="0.9"/>
  <circle cx="700" cy="250" r="1.4" fill="#fff" opacity="0.7"/>
  <circle cx="80" cy="150" r="0.8" fill="#fff" opacity="0.5"/>
  <circle cx="720" cy="140" r="1" fill="#fff" opacity="0.6"/>

  <!-- JEDI text - outline only, Star Wars style tall narrow letters -->
  <text x="400" y="130" text-anchor="middle"
        font-family="'Franklin Gothic Heavy', 'Arial Black', 'Impact', sans-serif"
        font-size="90" font-weight="900"
        letter-spacing="18"
        fill="none" stroke="#FFE81F" stroke-width="2">
    JEDI
  </text>

  <!-- ACADEMY text - outline only -->
  <text x="400" y="220" text-anchor="middle"
        font-family="'Franklin Gothic Heavy', 'Arial Black', 'Impact', sans-serif"
        font-size="70" font-weight="900"
        letter-spacing="14"
        fill="none" stroke="#FFE81F" stroke-width="1.5">
    ACADEMY
  </text>

  <!-- Decorative lines -->
  <line x1="120" y1="145" x2="320" y2="145" stroke="#FFE81F" stroke-width="1" opacity="0.6"/>
  <line x1="480" y1="145" x2="680" y2="145" stroke="#FFE81F" stroke-width="1" opacity="0.6"/>

  <!-- Small star accent -->
  <polygon points="400,148 403,140 406,148 398,143 408,143"
           fill="#FFE81F" opacity="0.7"/>
</svg>